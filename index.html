<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Gungeon Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #ui .weapon-info {
            margin-top: 10px;
            color: #ffd700;
        }
        #ui .controls {
            margin-top: 10px;
            color: #aaa;
            font-size: 12px;
        }
        #roomIndicator {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
        }
        #score {
            position: absolute;
            top: 35px;
            right: 10px;
            color: #ffd700;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
        }
        #debug {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #888;
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>HP: <span id="hp">❤️❤️❤️</span></div>
            <div class="weapon-info">武器: <span id="weaponName">手枪</span></div>
            <div class="weapon-info">弹药: <span id="ammo">∞</span></div>
            <div class="controls">
                WASD - 移动<br>
                鼠标 - 瞄准/射击<br>
                数字键 1-6 - 切换武器<br>
                走进武器自动拾取
            </div>
        </div>
        <div id="roomIndicator">房间: <span id="roomNum">1</span>/3</div>
        <div id="score">击杀: <span id="killCount">0</span></div>
        <div id="debug"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // Game state - each room has its own state
        const game = {
            currentRoom: 0,
            rooms: [],
            player: null,
            globalBullets: [],
            globalParticles: [],
            killCount: 0,
            keys: {},
            mouse: { x: 0, y: 0, down: false }
        };

        // Weapon definitions - 6 different weapons
        const WEAPONS = {
            pistol: {
                name: '手枪',
                damage: 15,
                fireRate: 300,
                bulletSpeed: 8,
                bulletSize: 4,
                color: '#ffff00',
                ammo: Infinity,
                spread: 0,
                pellets: 1,
                effect: 'normal'
            },
            shotgun: {
                name: '霰弹枪',
                damage: 12,
                fireRate: 600,
                bulletSpeed: 7,
                bulletSize: 3,
                color: '#ff6600',
                ammo: 30,
                spread: 0.3,
                pellets: 5,
                effect: 'spread'
            },
            machinegun: {
                name: '机枪',
                damage: 8,
                fireRate: 80,
                bulletSpeed: 10,
                bulletSize: 3,
                color: '#00ffff',
                ammo: 150,
                spread: 0.15,
                pellets: 1,
                effect: 'rapid'
            },
            sniper: {
                name: '狙击枪',
                damage: 50,
                fireRate: 1000,
                bulletSpeed: 15,
                bulletSize: 6,
                color: '#ff00ff',
                ammo: 20,
                spread: 0,
                pellets: 1,
                effect: 'pierce'
            },
            flamethrower: {
                name: '火焰喷射器',
                damage: 3,
                fireRate: 50,
                bulletSpeed: 5,
                bulletSize: 8,
                color: '#ff4400',
                ammo: 100,
                spread: 0.4,
                pellets: 3,
                effect: 'fire'
            },
            laser: {
                name: '激光枪',
                damage: 25,
                fireRate: 400,
                bulletSpeed: 20,
                bulletSize: 4,
                color: '#00ff00',
                ammo: 50,
                spread: 0,
                pellets: 1,
                effect: 'laser'
            }
        };

        // Particle class for effects
        class Particle {
            constructor(x, y, color, speed, size, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = size;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.size *= 0.95;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, angle, weapon, isEnemy = false) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = weapon.bulletSpeed;
                this.damage = weapon.damage;
                this.size = weapon.bulletSize;
                this.color = isEnemy ? '#ff0000' : weapon.color;
                this.effect = weapon.effect;
                this.life = 100;
                this.trail = [];
                this.isEnemy = isEnemy;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life--;

                if (this.effect === 'fire' && Math.random() < 0.3) {
                    game.globalParticles.push(new Particle(
                        this.x, this.y, '#ff6600', 2, 4, 20
                    ));
                }

                if (this.effect === 'laser' && Math.random() < 0.5) {
                    game.globalParticles.push(new Particle(
                        this.x, this.y, '#00ff88', 1, 3, 15
                    ));
                }
            }

            draw(ctx) {
                if (this.effect !== 'laser') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size / 2;
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    for (let i = 0; i < this.trail.length; i++) {
                        const point = this.trail[i];
                        if (i === 0) ctx.moveTo(point.x, point.y);
                        else ctx.lineTo(point.x, point.y);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (this.effect === 'laser') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x - Math.cos(this.angle) * 20, this.y - Math.sin(this.angle) * 20);
                    ctx.lineTo(this.x + Math.cos(this.angle) * 10, this.y + Math.sin(this.angle) * 10);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        }

        // Weapon pickup class
        class WeaponPickup {
            constructor(x, y, weaponKey) {
                this.x = x;
                this.y = y;
                this.weaponKey = weaponKey;
                this.weapon = WEAPONS[weaponKey];
                this.bobOffset = 0;
                this.glowPhase = 0;
                this.pickedUp = false;
            }

            update() {
                this.bobOffset = Math.sin(Date.now() / 300) * 5;
                this.glowPhase += 0.1;
            }

            draw(ctx) {
                if (this.pickedUp) return;
                const glowSize = 15 + Math.sin(this.glowPhase) * 5;

                const gradient = ctx.createRadialGradient(
                    this.x, this.y + this.bobOffset, 0,
                    this.x, this.y + this.bobOffset, glowSize
                );
                gradient.addColorStop(0, this.weapon.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.bobOffset, glowSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 12, this.y + this.bobOffset - 8, 24, 16);
                ctx.fillStyle = this.weapon.color;
                ctx.fillRect(this.x - 10, this.y + this.bobOffset - 6, 20, 12);

                ctx.fillStyle = '#fff';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(this.weapon.name, this.x, this.y + this.bobOffset + 25);
            }
        }

        // Enemy class
        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.radius = 14;
                this.hp = type === 'boss' ? 100 : (type === 'tank' ? 30 : 15);
                this.maxHp = this.hp;
                this.speed = type === 'fast' ? 2.5 : (type === 'boss' ? 1.5 : 1.2);
                this.angle = 0;
                this.lastShot = 0;
                this.fireRate = type === 'boss' ? 800 : 1500;
                this.damage = type === 'boss' ? 2 : 1;
                this.hitFlash = 0;
                this.dead = false;
                this.id = Math.random().toString(36).substr(2, 9);
            }

            update() {
                if (this.dead) return;

                const dx = game.player.x - this.x;
                const dy = game.player.y - this.y;
                const dist = Math.hypot(dx, dy);
                this.angle = Math.atan2(dy, dx);

                const targetDist = this.type === 'boss' ? 150 : 100;
                if (dist > targetDist) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                } else if (dist < 50) {
                    this.x -= (dx / dist) * this.speed;
                    this.y -= (dy / dist) * this.speed;
                }

                const room = game.rooms[game.currentRoom];
                this.x = Math.max(this.radius, Math.min(room.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(room.height - this.radius, this.y));

                if (Date.now() - this.lastShot > this.fireRate && dist < 400) {
                    this.shoot();
                }

                if (this.hitFlash > 0) this.hitFlash--;
            }

            shoot() {
                this.lastShot = Date.now();
                const bullet = new Bullet(
                    this.x + Math.cos(this.angle) * 20,
                    this.y + Math.sin(this.angle) * 20,
                    this.angle,
                    { bulletSpeed: 5, damage: this.damage, bulletSize: 4, color: '#ff0000', effect: 'normal' },
                    true
                );
                game.globalBullets.push(bullet);
            }

            takeDamage(damage) {
                this.hp -= damage;
                this.hitFlash = 5;
                if (this.hp <= 0) {
                    this.dead = true;
                    game.killCount++;
                    document.getElementById('killCount').textContent = game.killCount;
                    for (let i = 0; i < 10; i++) {
                        game.globalParticles.push(new Particle(
                            this.x, this.y,
                            this.type === 'boss' ? '#ff00ff' : '#ff0000',
                            5, 6, 30
                        ));
                    }
                }
            }

            draw(ctx) {
                if (this.dead) return;

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + 8, this.radius, this.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hitFlash > 0) {
                    ctx.fillStyle = '#fff';
                } else {
                    switch (this.type) {
                        case 'fast': ctx.fillStyle = '#e74c3c'; break;
                        case 'tank': ctx.fillStyle = '#8e44ad'; break;
                        case 'boss': ctx.fillStyle = '#c0392b'; break;
                        default: ctx.fillStyle = '#e74c3c';
                    }
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 3, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 3, 1.5, 0, Math.PI * 2);
                ctx.arc(this.x + 5, this.y - 3, 1.5, 0, Math.PI * 2);
                ctx.fill();

                const barWidth = 30;
                const barHeight = 4;
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - barWidth/2, this.y - this.radius - 10, barWidth, barHeight);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(this.x - barWidth/2, this.y - this.radius - 10, barWidth * (this.hp / this.maxHp), barHeight);
            }
        }

        // Player class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = 4;
                this.hp = 3;
                this.maxHp = 3;
                this.angle = 0;
                this.weapons = ['pistol'];
                this.currentWeaponIndex = 0;
                this.ammo = { pistol: Infinity };
                this.lastShot = 0;
                this.recoil = 0;
                this.muzzleFlash = 0;
                this.invulnerable = 0;
            }

            get currentWeapon() {
                return WEAPONS[this.weapons[this.currentWeaponIndex]];
            }

            update() {
                // Movement
                let dx = 0;
                let dy = 0;
                if (game.keys['w'] || game.keys['W']) dy -= 1;
                if (game.keys['s'] || game.keys['S']) dy += 1;
                if (game.keys['a'] || game.keys['A']) dx -= 1;
                if (game.keys['d'] || game.keys['D']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;

                const room = game.rooms[game.currentRoom];
                this.x = Math.max(this.radius, Math.min(room.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(room.height - this.radius, this.y));

                // Aiming
                const rect = canvas.getBoundingClientRect();
                const mouseX = game.mouse.x - rect.left;
                const mouseY = game.mouse.y - rect.top;
                this.angle = Math.atan2(mouseY - this.y, mouseX - this.x);

                // Shooting
                if (game.mouse.down && Date.now() - this.lastShot > this.currentWeapon.fireRate) {
                    this.shoot();
                }

                if (this.recoil > 0) this.recoil *= 0.9;
                if (this.muzzleFlash > 0) this.muzzleFlash--;
                if (this.invulnerable > 0) this.invulnerable--;

                // Check weapon pickup - only in current room
                const currentRoom = game.rooms[game.currentRoom];
                for (let i = currentRoom.weapons.length - 1; i >= 0; i--) {
                    const pickup = currentRoom.weapons[i];
                    if (pickup.pickedUp) continue;
                    const dist = Math.hypot(this.x - pickup.x, this.y - pickup.y);
                    if (dist < this.radius + 20) {
                        this.pickupWeapon(pickup.weaponKey);
                        pickup.pickedUp = true;
                    }
                }

                // Check enemy bullet collision
                for (let i = game.globalBullets.length - 1; i >= 0; i--) {
                    const bullet = game.globalBullets[i];
                    if (bullet.isEnemy) {
                        const dist = Math.hypot(this.x - bullet.x, this.y - bullet.y);
                        if (dist < this.radius + bullet.size && this.invulnerable === 0) {
                            this.takeDamage(1);
                            game.globalBullets.splice(i, 1);
                        }
                    }
                }

                // Check enemy collision
                const currentEnemies = game.rooms[game.currentRoom].enemies;
                for (const enemy of currentEnemies) {
                    if (enemy.dead) continue;
                    const dist = Math.hypot(this.x - enemy.x, this.y - enemy.y);
                    if (dist < this.radius + enemy.radius && this.invulnerable === 0) {
                        this.takeDamage(enemy.damage);
                    }
                }

                // Room transition
                this.checkRoomTransition();
            }

            takeDamage(damage) {
                this.hp -= damage;
                this.invulnerable = 60;
                document.getElementById('hp').textContent = '❤️'.repeat(Math.max(0, this.hp));

                for (let i = 0; i < 5; i++) {
                    game.globalParticles.push(new Particle(
                        this.x, this.y, '#ff0000', 5, 4, 20
                    ));
                }

                if (this.hp <= 0) {
                    this.hp = this.maxHp;
                    this.x = 100;
                    this.y = 300;
                    game.currentRoom = 0;
                    document.getElementById('hp').textContent = '❤️'.repeat(this.hp);
                }
            }

            shoot() {
                const weapon = this.currentWeapon;
                if (this.ammo[this.weapons[this.currentWeaponIndex]] <= 0 && weapon.ammo !== Infinity) {
                    return;
                }

                this.lastShot = Date.now();
                this.recoil = weapon.effect === 'shotgun' ? 8 : 3;
                this.muzzleFlash = 5;

                if (weapon.ammo !== Infinity) {
                    this.ammo[this.weapons[this.currentWeaponIndex]]--;
                }

                for (let i = 0; i < weapon.pellets; i++) {
                    const spread = (Math.random() - 0.5) * weapon.spread;
                    const bullet = new Bullet(
                        this.x + Math.cos(this.angle) * 20,
                        this.y + Math.sin(this.angle) * 20,
                        this.angle + spread,
                        weapon
                    );
                    game.globalBullets.push(bullet);
                }

                for (let i = 0; i < 5; i++) {
                    game.globalParticles.push(new Particle(
                        this.x + Math.cos(this.angle) * 18,
                        this.y + Math.sin(this.angle) * 18,
                        weapon.color,
                        5,
                        3,
                        10
                    ));
                }

                for (let i = 0; i < 2; i++) {
                    const shellAngle = this.angle + (Math.random() - 0.5) * 2 + Math.PI / 2;
                    const shell = new Particle(
                        this.x + Math.cos(this.angle) * 15,
                        this.y + Math.sin(this.angle) * 15,
                        '#ffcc00',
                        3,
                        2,
                        30
                    );
                    shell.vx = Math.cos(shellAngle) * 3;
                    shell.vy = Math.sin(shellAngle) * 3;
                    game.globalParticles.push(shell);
                }
            }

            pickupWeapon(weaponKey) {
                if (!this.weapons.includes(weaponKey)) {
                    this.weapons.push(weaponKey);
                    this.ammo[weaponKey] = WEAPONS[weaponKey].ammo;
                } else {
                    this.ammo[weaponKey] = WEAPONS[weaponKey].ammo;
                }
                this.currentWeaponIndex = this.weapons.indexOf(weaponKey);
                this.updateUI();
            }

            switchWeapon(index) {
                if (index >= 0 && index < this.weapons.length) {
                    this.currentWeaponIndex = index;
                    this.updateUI();
                }
            }

            checkRoomTransition() {
                const room = game.rooms[game.currentRoom];

                for (const door of room.doors) {
                    const dist = Math.hypot(this.x - door.x, this.y - door.y);
                    if (dist < 30) {
                        const oldRoom = game.currentRoom;
                        game.currentRoom = door.targetRoom;

                        // Position player at opposite door
                        const newRoom = game.rooms[door.targetRoom];
                        for (const newDoor of newRoom.doors) {
                            if (newDoor.targetRoom === oldRoom) {
                                this.x = newDoor.x + (newDoor.x < newRoom.width / 2 ? 50 : -50);
                                this.y = newDoor.y;
                                break;
                            }
                        }

                        // Clear bullets when changing rooms
                        game.globalBullets = [];

                        // Spawn enemies for new room if first visit
                        this.spawnRoomEnemies(game.currentRoom);

                        this.updateUI();
                        break;
                    }
                }
            }

            spawnRoomEnemies(roomIndex) {
                const room = game.rooms[roomIndex];

                // Only spawn if not already spawned
                if (room.enemiesSpawned) return;
                room.enemiesSpawned = true;

                if (roomIndex === 0) {
                    room.enemies.push(new Enemy(600, 200, 'basic'));
                    room.enemies.push(new Enemy(600, 400, 'basic'));
                } else if (roomIndex === 1) {
                    room.enemies.push(new Enemy(500, 150, 'fast'));
                    room.enemies.push(new Enemy(700, 300, 'tank'));
                    room.enemies.push(new Enemy(500, 450, 'basic'));
                } else if (roomIndex === 2) {
                    room.enemies.push(new Enemy(600, 300, 'boss'));
                    room.enemies.push(new Enemy(500, 200, 'basic'));
                    room.enemies.push(new Enemy(500, 400, 'basic'));
                }
            }

            updateUI() {
                document.getElementById('hp').textContent = '❤️'.repeat(Math.max(0, this.hp));
                document.getElementById('weaponName').textContent = this.currentWeapon.name;
                const ammo = this.ammo[this.weapons[this.currentWeaponIndex]];
                document.getElementById('ammo').textContent = ammo === Infinity ? '∞' : ammo;
                document.getElementById('roomNum').textContent = game.currentRoom + 1;
            }

            draw(ctx) {
                if (this.invulnerable > 0 && Math.floor(this.invulnerable / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + 8, this.radius, this.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4a90d9';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(this.x - this.radius, this.y - 4, this.radius * 2, 4);

                const gunLength = 18 - this.recoil;
                const gunX = this.x + Math.cos(this.angle) * gunLength;
                const gunY = this.y + Math.sin(this.angle) * gunLength;

                ctx.strokeStyle = '#666';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(this.x + Math.cos(this.angle) * 8, this.y + Math.sin(this.angle) * 8);
                ctx.lineTo(gunX, gunY);
                ctx.stroke();

                ctx.strokeStyle = this.currentWeapon.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + Math.cos(this.angle) * 10, this.y + Math.sin(this.angle) * 10);
                ctx.lineTo(gunX - 2, gunY - 2);
                ctx.stroke();

                if (this.muzzleFlash > 0) {
                    ctx.fillStyle = '#ffff00';
                    ctx.globalAlpha = this.muzzleFlash / 5;
                    ctx.beginPath();
                    ctx.arc(gunX, gunY, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = this.invulnerable > 0 ? 0.5 : 1;
                }

                const eyeOffset = Math.PI / 6;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(
                    this.x + Math.cos(this.angle + eyeOffset) * 5,
                    this.y + Math.sin(this.angle + eyeOffset) * 5,
                    3, 0, Math.PI * 2
                );
                ctx.arc(
                    this.x + Math.cos(this.angle - eyeOffset) * 5,
                    this.y + Math.sin(this.angle - eyeOffset) * 5,
                    3, 0, Math.PI * 2
                );
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(
                    this.x + Math.cos(this.angle + eyeOffset) * 6,
                    this.y + Math.sin(this.angle + eyeOffset) * 6,
                    1.5, 0, Math.PI * 2
                );
                ctx.arc(
                    this.x + Math.cos(this.angle - eyeOffset) * 6,
                    this.y + Math.sin(this.angle - eyeOffset) * 6,
                    1.5, 0, Math.PI * 2
                );
                ctx.fill();

                ctx.globalAlpha = 1;
            }
        }

        // Room class
        class Room {
            constructor(width, height, type, roomIndex) {
                this.width = width;
                this.height = height;
                this.type = type;
                this.roomIndex = roomIndex;
                this.doors = [];
                this.walls = [];
                this.floorTiles = [];
                this.weapons = [];
                this.enemies = [];
                this.enemiesSpawned = false;
                this.generate();
            }

            generate() {
                const tileSize = 40;
                for (let x = 0; x < this.width; x += tileSize) {
                    for (let y = 0; y < this.height; y += tileSize) {
                        this.floorTiles.push({
                            x, y,
                            variant: Math.random() < 0.1 ? 1 : 0
                        });
                    }
                }

                const wallThickness = 20;
                this.walls.push({ x: 0, y: 0, width: this.width, height: wallThickness });
                this.walls.push({ x: 0, y: this.height - wallThickness, width: this.width, height: wallThickness });
                this.walls.push({ x: 0, y: 0, width: wallThickness, height: this.height });
                this.walls.push({ x: this.width - wallThickness, y: 0, width: wallThickness, height: this.height });
            }

            addDoor(x, y, targetRoom) {
                this.doors.push({ x, y, targetRoom });
            }

            addWeapon(x, y, weaponKey) {
                this.weapons.push(new WeaponPickup(x, y, weaponKey));
            }

            draw(ctx) {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, this.width, this.height);

                ctx.fillStyle = '#34495e';
                for (const tile of this.floorTiles) {
                    if (tile.variant === 1) {
                        ctx.fillRect(tile.x + 2, tile.y + 2, 36, 36);
                    }
                }

                ctx.strokeStyle = 'rgba(52, 73, 94, 0.3)';
                ctx.lineWidth = 1;
                for (let x = 0; x < this.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, this.height);
                    ctx.stroke();
                }
                for (let y = 0; y < this.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(this.width, y);
                    ctx.stroke();
                }

                ctx.fillStyle = '#1a252f';
                for (const wall of this.walls) {
                    ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
                }

                ctx.strokeStyle = '#34495e';
                ctx.lineWidth = 2;
                for (const wall of this.walls) {
                    ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);
                }

                for (const door of this.doors) {
                    ctx.fillStyle = '#1a252f';
                    ctx.fillRect(door.x - 25, door.y - 25, 50, 50);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(door.x - 15, door.y - 15, 30, 30);

                    const gradient = ctx.createRadialGradient(door.x, door.y, 0, door.x, door.y, 20);
                    gradient.addColorStop(0, '#3498db');
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(door.x, door.y, 20, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('→', door.x, door.y + 4);
                }

                for (const weapon of this.weapons) {
                    if (!weapon.pickedUp) {
                        weapon.draw(ctx);
                    }
                }
            }
        }

        // Initialize game
        function init() {
            const room1 = new Room(800, 600, 'start', 0);
            const room2 = new Room(800, 600, 'combat', 1);
            const room3 = new Room(800, 600, 'boss', 2);

            room1.addDoor(780, 300, 1);
            room2.addDoor(20, 300, 0);
            room2.addDoor(780, 300, 2);
            room3.addDoor(20, 300, 1);

            game.rooms = [room1, room2, room3];

            game.player = new Player(100, 300);

            // Room 1: Shotgun and Machinegun
            room1.addWeapon(400, 200, 'shotgun');
            room1.addWeapon(400, 400, 'machinegun');

            // Room 2: Sniper and Flamethrower
            room2.addWeapon(400, 150, 'sniper');
            room2.addWeapon(400, 450, 'flamethrower');

            // Room 3: Laser and extra shotgun ammo
            room3.addWeapon(400, 200, 'laser');
            room3.addWeapon(400, 400, 'shotgun');

            // Spawn initial room enemies
            game.player.spawnRoomEnemies(0);

            game.player.updateUI();
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            game.keys[e.key] = true;

            if (e.key >= '1' && e.key <= '6') {
                const index = parseInt(e.key) - 1;
                game.player.switchWeapon(index);
            }
        });

        window.addEventListener('keyup', (e) => {
            game.keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            game.mouse.x = e.clientX;
            game.mouse.y = e.clientY;
        });

        canvas.addEventListener('mousedown', () => {
            game.mouse.down = true;
        });

        canvas.addEventListener('mouseup', () => {
            game.mouse.down = false;
        });

        // Game loop
        function update() {
            game.player.update();

            const currentRoom = game.rooms[game.currentRoom];

            // Update enemies in current room only
            for (let i = currentRoom.enemies.length - 1; i >= 0; i--) {
                const enemy = currentRoom.enemies[i];
                enemy.update();

                if (enemy.dead) {
                    currentRoom.enemies.splice(i, 1);
                }
            }

            // Update bullets
            for (let i = game.globalBullets.length - 1; i >= 0; i--) {
                const bullet = game.globalBullets[i];
                bullet.update();

                // Check bullet-enemy collision (player bullets)
                if (!bullet.isEnemy) {
                    for (const enemy of currentRoom.enemies) {
                        if (enemy.dead) continue;
                        const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                        if (dist < enemy.radius + bullet.size) {
                            enemy.takeDamage(bullet.damage);
                            bullet.life = 0;
                            break;
                        }
                    }
                }

                // Remove dead bullets
                if (bullet.life <= 0 ||
                    bullet.x < 0 || bullet.x > currentRoom.width ||
                    bullet.y < 0 || bullet.y > currentRoom.height) {
                    game.globalBullets.splice(i, 1);
                }
            }

            // Update particles
            for (let i = game.globalParticles.length - 1; i >= 0; i--) {
                const particle = game.globalParticles[i];
                particle.update();
                if (particle.life <= 0) {
                    game.globalParticles.splice(i, 1);
                }
            }

            // Update weapons in current room
            for (const weapon of currentRoom.weapons) {
                weapon.update();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const currentRoom = game.rooms[game.currentRoom];

            currentRoom.draw(ctx);

            for (const particle of game.globalParticles) {
                particle.draw(ctx);
            }

            for (const bullet of game.globalBullets) {
                bullet.draw(ctx);
            }

            for (const enemy of currentRoom.enemies) {
                enemy.draw(ctx);
            }

            game.player.draw(ctx);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
